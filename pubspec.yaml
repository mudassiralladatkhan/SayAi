name: saynote_ai
description: SayNote AI - A voice-first AI life assistant for Indian users.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^6.2.2
  firebase_messaging: ^16.2.0
  shared_preferences: ^2.2.2
  just_audio: ^0.10.5
  record: ^6.2.0
  permission_handler: ^12.0.1
  razorpay_flutter: ^1.3.6
  flutter_local_notifications: ^21.0.0
  android_alarm_manager_plus: ^5.0.0
  http: ^1.1.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  local_auth: ^3.0.1
  screenshot: ^3.0.0
  share_plus: ^13.1.0
  intl: ^0.20.2
  provider: ^6.1.1
  lottie: ^3.3.3
  flutter_dotenv: ^6.0.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_logo.png'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/images/app_logo.png'
  min_sdk_android: 21
  web:
    generate: false
